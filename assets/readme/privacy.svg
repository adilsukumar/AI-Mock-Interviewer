<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="t d"><title id="t">This is an online application. Fallback audio and conversation text go to Groq; the configured speech endpoint requests generated audio from StreamElements. Webcam preview is not automated vision monitoring.</title><desc id="d">This is an online application. Fallback audio and conversation text go to Groq; the configured speech endpoint requests generated audio from StreamElements. Webcam preview is not automated vision monitoring. Conceptual conversation artwork, not an application screenshot, user recording or measured interview result.</desc><style>@keyframes pulse{50%{opacity:.25}}@keyframes sound{50%{transform:scaleY(.3)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 4s ease-in-out infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.sound,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="340" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#F3D962" font-weight="600" >AUDIO</text><text x="46" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >Fallback recordings go</text><text x="46" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >to Groq for</text><text x="46" y="184" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >transcription after a</text><text x="46" y="218" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >pause.</text><rect x="389" y="12" width="340" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(409 34) scale(0.9090909090909091)"><path d="M4 5h36v26H18L8 41V31H4zM11 14h22M11 22h15" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="466" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#F3D962" font-weight="600" >CONVERSATION</text><text x="411" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >Interview messages and</text><text x="411" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >context are processed</text><text x="411" y="184" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >by Groq.</text><rect x="754" y="12" width="340" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(774 34) scale(0.9090909090909091)"><path d="M4 17h9L27 5v34L13 27H4zM33 14q10 8 0 16M37 7q17 15 0 30" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="831" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#F3D962" font-weight="600" >SPOKEN REPLIES</text><text x="776" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >The configured server</text><text x="776" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >endpoint requests audio</text><text x="776" y="184" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >from StreamElements.</text></svg>