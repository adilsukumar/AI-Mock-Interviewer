<svg xmlns="http://www.w3.org/2000/svg" width="640" height="645" viewBox="0 0 640 645" role="img" aria-labelledby="t d"><title id="t">Capture through browser speech recognition or server transcription, converse with a Groq-hosted model, then play a spoken reply before resuming listening.</title><desc id="d">Capture through browser speech recognition or server transcription, converse with a Groq-hosted model, then play a spoken reply before resuming listening. Conceptual conversation artwork, not an application screenshot, user recording or measured interview result.</desc><style>@keyframes pulse{50%{opacity:.25}}@keyframes sound{50%{transform:scaleY(.3)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 4s ease-in-out infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.sound,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="26" fill="#F3D962" font-weight="600" >CAPTURE</text><text x="46" y="118" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Browser speech recognition, with a Groq</text><text x="46" y="152" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >transcription fallback.</text><rect x="24" y="222" width="592" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 244) scale(0.9090909090909091)"><path d="M22 3l18 10v19L22 42 4 32V13zM4 13l18 10 18-10M22 23v19" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="272" font-family="Bahnschrift, Arial, sans-serif" font-size="26" fill="#F3D962" font-weight="600" >CONVERSE</text><text x="46" y="328" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >The server sends the conversation and</text><text x="46" y="362" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >interview context to Groq.</text><rect x="24" y="432" width="592" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 454) scale(0.9090909090909091)"><path d="M4 17h9L27 5v34L13 27H4zM33 14q10 8 0 16M37 7q17 15 0 30" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="482" font-family="Bahnschrift, Arial, sans-serif" font-size="26" fill="#F3D962" font-weight="600" >RESPOND</text><text x="46" y="538" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Text-to-speech plays the reply before</text><text x="46" y="572" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >listening resumes.</text></svg>