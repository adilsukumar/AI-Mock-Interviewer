<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-labelledby="t d"><title id="t">Hands-free answers, configurable interview context, conversational model responses and generated practice feedback. The displayed verdict is a simulation, not a hiring assessment.</title><desc id="d">Hands-free answers, configurable interview context, conversational model responses and generated practice feedback. The displayed verdict is a simulation, not a hiring assessment. Conceptual conversation artwork, not an application screenshot, user recording or measured interview result.</desc><style>@keyframes pulse{50%{opacity:.25}}@keyframes sound{50%{transform:scaleY(.3)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 4s ease-in-out infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.sound,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="245" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#F3D962" font-weight="600" >SPEAK, THEN PAUSE</text><text x="46" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Silence detection advances a spoken</text><text x="46" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >answer without a send button.</text><rect x="574" y="12" width="522" height="245" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 34) scale(0.9090909090909091)"><path d="M22 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M7 40q0-16 15-16t15 16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="651" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#F3D962" font-weight="600" >CHOOSE THE CONTEXT</text><text x="596" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Role, experience level and company</text><text x="596" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >persona shape the prompt.</text><rect x="24" y="272" width="522" height="245" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 294) scale(0.9090909090909091)"><path d="M4 5h36v26H18L8 41V31H4zM11 14h22M11 22h15" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="322" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#F3D962" font-weight="600" >CONVERSATIONAL RESPONSES</text><text x="46" y="380" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Groq generates short follow-up</text><text x="46" y="414" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >questions and acknowledgements.</text><rect x="574" y="272" width="522" height="245" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 294) scale(0.9090909090909091)"><path d="M5 5h34v35H5zM12 14h20M12 23h15M12 32h10" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="651" y="322" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#F3D962" font-weight="600" >PRACTICE FEEDBACK</text><text x="596" y="380" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >The conversation ends with</text><text x="596" y="414" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >model-generated strengths,</text><text x="596" y="448" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >improvements and a simulated verdict.</text></svg>