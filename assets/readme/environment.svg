<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="t d"><title id="t">Current documented developer prerequisites: Node.js 18 or later, npm and a Groq API key. Configure the environment locally and keep real credentials out of Git.</title><desc id="d">Current documented developer prerequisites: Node.js 18 or later, npm and a Groq API key. Configure the environment locally and keep real credentials out of Git. Conceptual conversation artwork, not an application screenshot, user recording or measured interview result.</desc><style>@keyframes pulse{50%{opacity:.25}}@keyframes sound{50%{transform:scaleY(.3)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 4s ease-in-out infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.sound,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="1072" height="200" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 37) scale(1.0)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="112" y="74" font-family="Bahnschrift, Arial, sans-serif" font-size="31" fill="#F8F8F3" font-weight="600" >LOCAL DEVELOPMENT</text><text x="46" y="136" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >Node.js 18+  /  npm  /  Groq API key</text><text x="46" y="184" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >Configure credentials in .env.local. Keep real keys out of Git.</text></svg>