<svg xmlns="http://www.w3.org/2000/svg" width="520" height="136" viewBox="0 0 520 136" role="img" aria-labelledby="t d"><title id="t">Transcription route. Fallback audio validation and transcription</title><desc id="d">Transcription route. Fallback audio validation and transcription Conceptual conversation artwork, not an application screenshot, user recording or measured interview result.</desc><style>@keyframes pulse{50%{opacity:.25}}@keyframes sound{50%{transform:scaleY(.3)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 4s ease-in-out infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.sound,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="132" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(20 24) scale(0.9090909090909091)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="80" y="49" font-family="Bahnschrift, Arial, sans-serif" font-size="28" fill="#F3D962" font-weight="600" >Transcription route</text><text x="21" y="104" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >Fallback audio validation and transcription</text></svg>