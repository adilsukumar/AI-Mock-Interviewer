<svg xmlns="http://www.w3.org/2000/svg" width="520" height="136" viewBox="0 0 520 136" role="img" aria-labelledby="t d"><title id="t">Audio regression tests. Microphone lifecycle checks</title><desc id="d">Audio regression tests. Microphone lifecycle checks Conceptual conversation artwork, not an application screenshot, user recording or measured interview result.</desc><style>@keyframes pulse{50%{opacity:.25}}@keyframes sound{50%{transform:scaleY(.3)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 4s ease-in-out infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.sound,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="132" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(20 24) scale(0.9090909090909091)"><path d="M5 6h32v34H5zM12 16l4 4 8-8M12 29h17" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="80" y="49" font-family="Bahnschrift, Arial, sans-serif" font-size="28" fill="#F3D962" font-weight="600" >Audio regression tests</text><text x="21" y="104" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >Microphone lifecycle checks</text></svg>